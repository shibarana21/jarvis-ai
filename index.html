<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050b14">

  <title>JARVIS AI Assistant</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <aside id="sidebar" class="sidebar" aria-label="Chat history">
      <div class="sidebar-header">
        <div>
          <p class="small-label">CONVERSATIONS</p>
          <h2>Chat History</h2>
        </div>

        <button
          id="closeSidebarButton"
          class="icon-button"
          type="button"
          aria-label="Close menu"
        >
          ✕
        </button>
      </div>

      <button id="sidebarNewChatButton" class="primary-button" type="button">
        ＋ New Chat
      </button>

      <div id="chatList" class="chat-list"></div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="main">

      <header class="topbar">
        <button
          id="menuButton"
          class="icon-button"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>

        <div class="brand">
          <div class="logo-orbit" aria-hidden="true">
            <span>J</span>
          </div>

          <div>
            <h1>JARVIS</h1>
            <p><span class="status-dot"></span> UI MODE</p>
          </div>
        </div>

        <div class="topbar-actions">
          <button
            id="settingsButton"
            class="icon-button"
            type="button"
            aria-label="Settings"
          >
            ⚙
          </button>

          <button
            id="newChatButton"
            class="icon-button"
            type="button"
            aria-label="Create new chat"
          >
            ＋
          </button>
        </div>
      </header>

      <section
        id="messages"
        class="messages"
        aria-live="polite"
        aria-label="Chat messages"
      ></section>

      <div id="loadingIndicator" class="loading hidden">
        <span></span>
        <span></span>
        <span></span>
        <p>JARVIS is processing...</p>
      </div>

      <footer class="composer-area">
        <p id="voiceStatus" class="voice-status">
          Gemini backend अभी connected नहीं है
        </p>

        <form id="messageForm" class="composer">
          <button
            id="langToggleButton"
            class="composer-button"
            type="button"
            aria-label="Toggle language"
          >
            हिं
          </button>

          <button
            id="micButton"
            class="composer-button"
            type="button"
            aria-label="Voice input"
          >
            🎙
          </button>

          <textarea
            id="messageInput"
            rows="1"
            maxlength="4000"
            placeholder="Message JARVIS..."
            aria-label="Message"
          ></textarea>

          <button
            id="sendButton"
            class="send-button"
            type="submit"
            aria-label="Send message"
          >
            ➤
          </button>
        </form>
      </footer>

    </main>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-box">
      <h3>Settings</h3>
      <p class="small-label">Provider चुनें और अपनी API Key डालें (optional)</p>

      <select id="providerSelect">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI (ChatGPT)</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
      </select>

      <input
        id="apiKeyInput"
        type="text"
        placeholder="अपनी API key यहाँ paste करें"
      />

      <p class="settings-note">
        Key नहीं दी तो default key इस्तेमाल होगी।<br>
        Gemini: <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a><br>
        Groq: <a href="https://console.groq.com/keys" target="_blank">console.groq.com</a><br>
        OpenRouter: <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai</a>
      </p>

      <div class="settings-buttons">
        <button id="saveApiKeyButton" class="primary-button" type="button">Save</button>
        <button id="clearApiKeyButton" class="icon-button" type="button">Remove Key</button>
        <button id="closeSettingsButton" class="icon-button" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
