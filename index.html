<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050b14">

  <title>JARVIS AI Assistant</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <aside id="sidebar" class="sidebar" aria-label="Chat history">
      <div class="sidebar-header">
        <div>
          <p class="small-label">CONVERSATIONS</p>
          <h2>Chat History</h2>
        </div>

        <button
          id="closeSidebarButton"
          class="icon-button"
          type="button"
          aria-label="Close menu"
        >
          ✕
        </button>
      </div>

      <button id="sidebarNewChatButton" class="primary-button" type="button">
        ＋ New Chat
      </button>

      <div id="chatList" class="chat-list"></div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="main">

      <header class="topbar">
        <button
          id="menuButton"
          class="icon-button"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>

        <div class="brand">
          <div class="logo-orbit" aria-hidden="true">
            <span>J</span>
          </div>

          <div>
            <h1>JARVIS</h1>
            <p><span class="status-dot"></span> UI MODE</p>
          </div>
        </div>

        <button
          id="newChatButton"
          class="icon-button"
          type="button"
          aria-label="Create new chat"
        >
          ＋
        </button>
      </header>

      <section
        id="messages"
        class="messages"
        aria-live="polite"
        aria-label="Chat messages"
      ></section>

      <div id="loadingIndicator" class="loading hidden">
        <span></span>
        <span></span>
        <span></span>
        <p>JARVIS is processing...</p>
      </div>

      <footer class="composer-area">
        <p id="voiceStatus" class="voice-status">
          Gemini backend अभी connected नहीं है
        </p>

        <form id="messageForm" class="composer">
          <button
            id="micButton"
            class="composer-button"
            type="button"
            aria-label="Voice input"
          >
            🎙
          </button>

          <textarea
            id="messageInput"
            rows="1"
            maxlength="4000"
            placeholder="Message JARVIS..."
            aria-label="Message"
          ></textarea>

          <button
            id="sendButton"
            class="send-button"
            type="submit"
            aria-label="Send message"
          >
            ➤
          </button>
        </form>
      </footer>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
